name: H28K 固件快速组装（ImageBuilder 直接出固件，约 5 分钟）

# 阶段 2：用基础 Release 附带的自建 ImageBuilder 分钟级组装定制固件。
# 与「H28K 固件全量构建」的区别：本工作流不编译任何源码，用现成 ImageBuilder
# 组装（内核与全量构建完全一致，ABI 不变）；日常出固件用这个。
# 前提：对应版本的某个固件 Release 已附带 immortalwrt-imagebuilder-*.tar.zst
# （由「H28K 固件全量构建」工作流生成），插件包由「构建插件包」工作流提供。
# 包列表与首启配置见 config/ib-packages.list 与 config/firmware.conf。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '基于哪个版本的固件组装'
        type: choice
        required: true
        default: 25.12.1
        options:
          - 25.12.1
          - 25.12.0
          - 24.10.6
          - 24.10.5
      base_release:
        description: '基础 Release 标签，留空自动选择'
        type: string
        required: false
        default: ''
      publish_release:
        description: '发布为 Release'
        type: boolean
        required: false
        default: false
      lan_ip:
        description: 'LAN 管理地址'
        type: string
        required: false
        default: '192.168.100.1'
      password:
        description: 'root 密码'
        type: string
        required: false
        default: 'password'
      rootfs_size:
        description: '固件根目录大小'
        type: choice
        required: true
        default: '2048'
        options:
          - '512'
          - '1024'
          - '2048'

permissions:
  contents: write

concurrency:
  group: build-custom-hinlink-h28k
  cancel-in-progress: false

jobs:
  custom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 选择基础 Release 与插件包
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_ib.sh" \
            "${{ inputs.version }}" \
            "$GITHUB_OUTPUT" \
            "${{ inputs.base_release }}"

      - name: 下载 ImageBuilder 与插件包
        run: |
          curl -fsSL --retry 3 "${{ steps.base.outputs.url }}" -o ib.tar.xz
          if [[ -n "${{ steps.base.outputs.packages_url }}" ]]; then
            curl -fsSL --retry 3 "${{ steps.base.outputs.packages_url }}" -o plugins.tar.gz
            echo "PLUGINS_ARG=plugins.tar.gz" >> "$GITHUB_ENV"
          else
            echo "该版本尚无插件包附件，组装不含源码插件的固件（在 config/source-plugins.list 启用插件后跑「构建插件包」）"
            echo "PLUGINS_ARG=" >> "$GITHUB_ENV"
          fi
          ls -lh ib.tar.xz

      - name: 组装定制固件
        env:
          CFG_LAN_IP: ${{ inputs.lan_ip }}
          CFG_PASSWORD: ${{ inputs.password }}
          CFG_ROOTFS_SIZE: ${{ inputs.rootfs_size }}
        run: |
          mkdir out
          bash "$GITHUB_WORKSPACE/scripts/build_ib_image.sh" \
            ib.tar.xz \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_WORKSPACE/config/ib-packages.list" \
            "$GITHUB_WORKSPACE/out" \
            "$PLUGINS_ARG"

      - name: 上传定制固件构件
        uses: actions/upload-artifact@v4
        with:
          name: H28K 定制固件-${{ steps.base.outputs.tag }}
          path: out/*sysupgrade*.img.gz
          retention-days: 30

      - name: 发布定制固件 Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUSTOM_TAG="h28k-custom-${{ steps.base.outputs.tag }}-$(TZ=Asia/Hong_Kong date +'%H%M%S')"
          echo "CUSTOM_TAG=$CUSTOM_TAG" >> "$GITHUB_ENV"
          gh release create "$CUSTOM_TAG" out/*sysupgrade*.img.gz \
            --title "H28K 定制固件（基于 ${{ steps.base.outputs.tag }}）" \
            --notes "用自建 ImageBuilder 组装的定制固件，包列表见仓库 config/ib-packages.list，内核与 ${{ steps.base.outputs.tag }} 完全一致（ABI 不变）。"
