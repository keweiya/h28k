name: H28K 固件快速组装（ImageBuilder 直接出固件）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '基于哪个版本的固件组装'
        type: choice
        required: true
        default: 25.12.1
        options:
          - all
          - 25.12.1
          - 25.12.0
          - 24.10.6
          - 24.10.5
      lan_ip:
        description: 'LAN 管理地址'
        type: string
        required: false
        default: '192.168.100.1'
      password:
        description: 'root 密码'
        type: string
        required: false
        default: 'password'
      rootfs_size:
        description: '固件根目录大小'
        type: choice
        required: true
        default: 2G
        options:
          - 2G
          - 1G
          - 512M

permissions:
  contents: write

concurrency:
  group: assemble-h28k-custom-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  matrix:
    name: 解析组装版本矩阵
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 解析版本列表
        id: resolve
        run: |
          bash "$GITHUB_WORKSPACE/scripts/resolve_versions.sh" \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "${{ inputs.version }}" \
            "$GITHUB_OUTPUT"

  assemble:
    name: 组装 ${{ matrix.version }} 定制固件
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 选择基础 Release 与插件包
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_ib.sh" \
            "${{ matrix.version }}" \
            "$GITHUB_OUTPUT"

      - name: 下载 ImageBuilder 与插件包
        run: |
          curl -fsSL --retry 3 "${{ steps.base.outputs.url }}" -o ib.tar.zst
          if [[ -n "${{ steps.base.outputs.packages_url }}" ]]; then
            curl -fsSL --retry 3 "${{ steps.base.outputs.packages_url }}" -o plugins.tar.gz
            echo "PLUGINS_ARG=plugins.tar.gz" >> "$GITHUB_ENV"
          else
            echo "PLUGINS_ARG=" >> "$GITHUB_ENV"
          fi

      - name: 组装定制固件
        env:
          CFG_LAN_IP: ${{ inputs.lan_ip }}
          CFG_PASSWORD: ${{ inputs.password }}
          CFG_ROOTFS_SIZE: ${{ inputs.rootfs_size }}
        run: |
          mkdir -p out
          bash "$GITHUB_WORKSPACE/scripts/build_ib_image.sh" \
            ib.tar.zst \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_WORKSPACE/config/ib-packages.list" \
            "$GITHUB_WORKSPACE/out" \
            "$PLUGINS_ARG" \
            "${{ matrix.version }}"

      - name: 整理并重命名定制产物（剔除重复包，增加 custom 与版本号）
        run: |
          mkdir -p release_files
          V="${{ matrix.version }}"

          # 剔除无用的 targz-sysupgrade 重复包
          rm -f out/*targz-sysupgrade.img.gz 2>/dev/null || true

          # 拷贝并规范化重命名（统一加 v）
          for f in out/*ext4-sysupgrade.img.gz; do
            [ -f "$f" ] && cp -f "$f" "release_files/immortalwrt-v${V}-h28k-custom-ext4-sysupgrade.img.gz"
          done
          for f in out/*squashfs-sysupgrade.img.gz; do
            [ -f "$f" ] && cp -f "$f" "release_files/immortalwrt-v${V}-h28k-custom-squashfs-sysupgrade.img.gz"
          done
          for f in out/*rootfs.tar.gz; do
            [ -f "$f" ] && cp -f "$f" "release_files/immortalwrt-v${V}-h28k-custom-rootfs.tar.gz"
          done

          echo "=== 定制待发布文件列表 ==="
          ls -lh release_files/

      - name: 生成 Release 总结信息
        run: |
          # 只统计官方插件源小节里 =y 的 luci-app-*（不含中文包/清单外/中文界面）
          enabled="$(sed -n '1,/^# === 清单外/p' "$GITHUB_WORKSPACE/config/ib-packages.list" \
            | grep -E '^luci-app-[A-Za-z0-9_.+-]+=y$' | cut -d= -f1)"
          # 预检剔除（官方源未收录）与安装失败（逐包降级）两个清单；不存在则视为空
          cp out/missing-packages.txt missing.txt 2>/dev/null || touch missing.txt
          cp out/failed-packages.txt failed.txt 2>/dev/null || touch failed.txt
          # 已启用列表 = =y 的 app，剔除预检跳过与安装失败的
          plugins=''
          for p in $enabled; do
            grep -qxF "$p" missing.txt && continue
            grep -qxF "$p" failed.txt && continue
            plugins="$plugins $p"
          done
          # 中文包一律并入其 app 显示（成功或失败都只显示 app 一条）
          failed_note=''
          while IFS= read -r p; do
            [[ -n "$p" ]] || continue
            case "$p" in luci-i18n-*) continue ;; esac
            failed_note="$failed_note $p"
          done < failed.txt
          missing_note=''
          while IFS= read -r p; do
            [[ -n "$p" ]] || continue
            case "$p" in luci-i18n-*) continue ;; esac
            missing_note="$missing_note $p"
          done < missing.txt

          # 多行值写入 GITHUB_ENV 需 <<EOF 语法；子列表逐行一个包便于查看。
          # 注意值里不能带反引号（NOTES 是双引号字符串，反引号会被命令替换）
          emit_list() {   # $1=变量名 $2=标题 其余=条目（空格分隔，可为空）
            var="$1"; title="$2"; shift 2
            {
              echo "$var<<LIST_EOF"
              echo "$title"
              for p in "$@"; do
                echo "  - $p"
              done
              echo "LIST_EOF"
            } >> "$GITHUB_ENV"
          }
          if [[ -n "${plugins// /}" ]]; then
            emit_list PLUGIN_LINE "- **已启用插件**：" $plugins
          else
            echo "PLUGIN_LINE=" >> "$GITHUB_ENV"
          fi
          if [[ -n "${failed_note// /}" ]]; then
            emit_list FAILED_LINE "- **⚠ 以下插件安装失败，已自动跳过**：" $failed_note
          else
            echo "FAILED_LINE=" >> "$GITHUB_ENV"
          fi
          if [[ -n "${missing_note// /}" ]]; then
            emit_list MISSING_LINE "- **⚠ 以下包官方源未收录，已自动跳过**：" $missing_note
          else
            echo "MISSING_LINE=" >> "$GITHUB_ENV"
          fi
          if [[ -z "$failed_note" && -z "$missing_note" ]]; then
            echo "OK_LINE=- ✅ 全部插件安装成功" >> "$GITHUB_ENV"
          else
            echo "OK_LINE=" >> "$GITHUB_ENV"
          fi

      - name: 上传定制固件构件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ matrix.version }}-h28k-custom-${{ github.run_number }}
          path: release_files/*
          retention-days: 30

      - name: 发布 Release（唯一 Custom Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="immortalwrt-h28k-custom-v${{ matrix.version }}"
          BUILD_TIME="$(TZ=Asia/Hong_Kong date +'%Y-%m-%d %H:%M')"
          TITLE="ImmortalWrt H28K 定制固件 v${{ matrix.version }}"
          NOTES="## ImmortalWrt H28K 定制固件 v${{ matrix.version }}

          - **构建类型**：ImageBuilder 组装（开箱即用定制版）
          - **组装时间**：$BUILD_TIME
          - **基于底包**：ImmortalWrt v${{ matrix.version }}
          - **设备型号**：HINLINK H28K (RK3528)
          - **管理地址**：\`${{ inputs.lan_ip }}\`
          - **默认密码**：\`${{ inputs.password }}\`
          ${{ env.PLUGIN_LINE }}
          ${{ env.OK_LINE }}
          ${{ env.MISSING_LINE }}
          ${{ env.FAILED_LINE }}
          - **包含附件**：
            - \`immortalwrt-v${{ matrix.version }}-h28k-custom-ext4-sysupgrade.img.gz\`
            - \`immortalwrt-v${{ matrix.version }}-h28k-custom-squashfs-sysupgrade.img.gz\`
            - \`immortalwrt-v${{ matrix.version }}-h28k-custom-rootfs.tar.gz\`"

          shopt -s nullglob
          FILES=(release_files/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "未找到发布文件"
            exit 1
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES"
          fi

          if [[ "${{ matrix.version }}" == "25.12.1" ]]; then
            gh release edit "$TAG" --latest
          else
            gh release edit "$TAG" --latest=false
          fi
          # 源码快照同步：把 tag 移到本次组装的 commit，Release 页面的
          # Source code (zip/tar.gz) 才会随附件一起更新
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
