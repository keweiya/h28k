name: H28K 插件包构建（24.10 出 ipk / 25.12 出 apk，按系列发布）

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布插件包为 Release'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: build-packages-hinlink-h28k
  cancel-in-progress: false

jobs:
  packages:
    name: 编译 ${{ matrix.version }} 插件包
    strategy:
      fail-fast: false
      # 固定使用两个系列滚动快照的官方 SDK：24.10 出 ipk、25.12 出 apk。
      # 插件包按系列发布（不带固件版本号），同系列全部版本的组装共用；
      # 快照 SDK 编译的用户态包对同系列各点版本兼容
      matrix:
        version:
          - 24.10-SNAPSHOT
          - 25.12-SNAPSHOT
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G

    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 安装 SDK 编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang cmake cpio file flex gawk gettext git libelf-dev \
            libncurses-dev libssl-dev python3 python3-ply python3-pyelftools \
            rsync subversion swig unzip upx-ucl wget xxd zlib1g-dev zstd

      - name: 选择目标版本
        id: release
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_release.sh" \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_OUTPUT" \
            "${{ matrix.version }}"

      - name: 解析 SDK 下载地址
        id: sdk
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_sdk.sh" \
            "${{ steps.release.outputs.version }}" \
            "$GITHUB_OUTPUT"

      - name: 恢复下载与编译缓存（dl + ccache，按版本键）
        uses: actions/cache@v4
        with:
          path: |
            sdk/dl
            sdk/.ccache
          key: h28k-pkgcache-${{ steps.release.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            h28k-pkgcache-${{ steps.release.outputs.version }}-
            h28k-pkgcache-

      - name: 下载并解包 SDK
        run: |
          sdk_name="${{ steps.sdk.outputs.sdk_name }}"
          curl -fsSL --retry 3 "${{ steps.sdk.outputs.sdk_url }}" -o "$sdk_name"
          # -p：缓存恢复会先创建 sdk/ 目录，不能因已存在而失败
          mkdir -p sdk
          case "$sdk_name" in
            *.tar.zst) tar --zstd -xf "$sdk_name" -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf "$sdk_name" -C sdk --strip-components=1 ;;
            *) echo "未知 SDK 压缩格式: $sdk_name"; exit 1 ;;
          esac
          ls -lh "$sdk_name"

      - name: 使用官方 feeds
        working-directory: sdk
        run: |
          # base_url 由 select_release.sh 输出：正式版与 X.Y-SNAPSHOT 为
          # releases/<版本>，master 为 snapshots——不能写死 releases/，否则
          # master 的 feeds.buildinfo 404
          curl -fsSL \
            "${{ steps.release.outputs.base_url }}/targets/rockchip/armv8/feeds.buildinfo" \
            -o feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 解析源码插件清单
        id: plugins
        working-directory: sdk
        run: |
          names=($(bash "$GITHUB_WORKSPACE/scripts/build_config.sh" source-plugins \
            . "$GITHUB_WORKSPACE/config/source-plugins.list"))
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::notice::config/source-plugins.list 没有启用的源码插件，本次不编译"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${names[@]}" | tee plugin-names.txt
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译插件（全速并行，逐包容错，只输出错误）
        if: steps.plugins.outputs.built == 'true'
        working-directory: sdk
        run: |
          names=($(cat plugin-names.txt))
          for name in "${names[@]}"; do
            echo "CONFIG_PACKAGE_${name}=y" >> .config
          done
          # ccache 跨运行编译缓存（配合 actions/cache 的 sdk/.ccache，
          # 容量由 job env 的 CCACHE_MAXSIZE 控制）
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          # 本步骤自行判断退出码：set +e 保住 PIPESTATUS（跟在 || true 后会被
          # true 重置为 0，失败会被误判成功、单核 V=s 详细重试永远不会触发）
          # 逐包容错：单包终败记入 failed-packages.txt 并继续编其余包，
          # 只有全部失败才中止（与组装阶段的缺包自动剔除同思路）
          set +e
          : > failed-packages.txt
          ok=0
          for name in "${names[@]}"; do
            echo "=== 编译插件: $name ==="
            make package/"$name"/compile -j"$(nproc)" 2>&1 | tee -a build.log | grep --line-buffered -iE 'error|failed'
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              echo "=== $name 编译失败（exit $code），转单核详细重试 ==="
              make package/"$name"/compile -j1 V=s 2>&1 | tee -a build-single.log
              code=${PIPESTATUS[0]}
              if [ "$code" -ne 0 ]; then
                echo "    ⚠ 编译失败，已跳过: $name"
                echo "$name" >> failed-packages.txt
                continue
              fi
              echo "=== $name 单核重试成功 ==="
            fi
            ok=$((ok+1))
          done
          total=$(wc -l < plugin-names.txt)
          echo "=== 编译完成：成功 $ok / $total ==="
          if [ "$ok" -eq 0 ]; then
            echo "❌ 全部插件编译失败"
            tail -n 200 build-single.log || true
            exit 1
          fi

      - name: 收集插件包并标准化重命名
        if: steps.plugins.outputs.built == 'true'
        run: |
          mkdir -p stage
          find sdk/bin/packages \( -name '*.ipk' -o -name '*.apk' \) ! -name 'kmod-*' -exec cp {} stage/ \;
          # packages.list 只保留编译成功的包：失败包若留在清单里，组装阶段
          # 会尝试安装不存在的包（触发逐包降级拖慢甚至预检剔除）
          if [ -s sdk/failed-packages.txt ]; then
            grep -vxFf sdk/failed-packages.txt sdk/plugin-names.txt > stage/packages.list
            cp sdk/failed-packages.txt stage/failed-packages.list
          else
            cp sdk/plugin-names.txt stage/packages.list
          fi
          count=$(find stage \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "没有收集到任何插件包"
            exit 1
          fi
          # 系列级命名（不带固件版本号）：24.10-SNAPSHOT → 24.10，25.12-SNAPSHOT → 25.12
          V="${{ matrix.version }}"
          V="${V%-SNAPSHOT}"
          PKG_NAME="immortalwrt-${V}-h28k-packages.tar.gz"
          tar -czf "$PKG_NAME" -C stage .
          echo "PKG_FILE=$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_TAG=immortalwrt-h28k-packages-$V" >> "$GITHUB_ENV"
          echo "PKG_VERSION_SUFFIX=$V" >> "$GITHUB_ENV"
          ls -lh "$PKG_NAME"

      - name: 上传插件包构件
        if: steps.plugins.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ matrix.version }}-h28k-packages-${{ github.run_number }}
          path: ${{ env.PKG_FILE }}
          retention-days: 30

      - name: 上传编译日志与失败清单
        if: steps.plugins.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ matrix.version }}-h28k-packages-logs-${{ github.run_number }}
          path: |
            sdk/build.log
            sdk/build-single.log
            sdk/failed-packages.txt
          if-no-files-found: ignore
          retention-days: 15

      - name: 发布插件包 Release（独立 Packages Release）
        if: inputs.publish_release && steps.plugins.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.PKG_TAG }}"
          TITLE="ImmortalWrt H28K 插件包 ${{ env.PKG_VERSION_SUFFIX }}"
          # 编译失败的包如实标注（packages.list 已剔除，不会进入组装安装清单）
          FAILED_LINE=''
          if [ -s stage/failed-packages.list ]; then
            FAILED_LINE='- **⚠ 以下插件编译失败，本次未包含**：'
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              FAILED_LINE="$FAILED_LINE
            - $p"
            done < stage/failed-packages.list
          fi
          NOTES="## ImmortalWrt H28K 插件包 ${{ env.PKG_VERSION_SUFFIX }}

          - **组件类型**：源码插件独立编译包（供组装定制固件注入）
          - **基于底包**：ImmortalWrt ${{ steps.release.outputs.revision }}
          - **已包含插件**：$(cat stage/packages.list | tr '\n' ' ')
          ${FAILED_LINE}
          - **附件内容**：\`${{ env.PKG_FILE }}\` 为整包（组装阶段自动注入用，含 packages.list 清单）；其余 .apk/.ipk 为各插件单独附件，可按需手动下载"

          shopt -s nullglob
          # 整包（自动注入用）+ 各插件单独附件
          FILES=("${{ env.PKG_FILE }}")
          for f in stage/*.apk stage/*.ipk; do
            FILES+=("$f")
          done
          echo "=== 发布附件（${#FILES[@]} 个）==="
          ls -lh "${FILES[@]}"

          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true
          # 插件包是独立 Release，不参与 Latest 竞争（Latest 保持给最新正式版固件）
          gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES" --latest=false
