name: H28K 插件包构建（SDK 编译源码插件 → 长期 Release）

# 用官方 SDK（与固件同版本、同 musl ABI）单独编译 config/source-plugins.list
# 里启用的第三方插件（nikki、fluent 主题等），打包发布到 Release。
# 这些包由「H28K 固件快速组装」在组装固件时自动注入——
# 插件更新只需重跑本工作流（约 15~30 分钟），无需全量重编固件。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '目标 ImmortalWrt 版本（决定使用哪个官方 SDK）'
        type: choice
        required: true
        default: 25.12.1
        options:
          - 25.12.1
          - 25.12.0
          - 24.10.6
          - 24.10.5
      publish_release:
        description: '发布为 Release（长期保存，供快速定制构建使用）'
        type: boolean
        required: true
        default: true
      build_firmware:
        description: '编译完插件后立即用 ImageBuilder 组装固件（一步出完整固件，需同时开启发布）'
        type: boolean
        required: false
        default: false
      lan_ip:
        description: 'LAN 管理地址（留空使用 config/firmware.conf 的默认值，仅组装固件时生效）'
        type: string
        required: false
        default: ''
      password:
        description: 'root 密码（留空使用 config/firmware.conf 的默认值，仅组装固件时生效）'
        type: string
        required: false
        default: ''
      rootfs_size:
        description: '固件根目录大小（MiB，仅组装固件时生效）'
        type: choice
        required: false
        default: '2048'
        options:
          - '512'
          - '1024'
          - '2048'

permissions:
  contents: write

concurrency:
  group: build-packages-hinlink-h28k
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 检查参数组合
        run: |
          if [[ "${{ inputs.build_firmware }}" == "true" && "${{ inputs.publish_release }}" != "true" ]]; then
            echo "build_firmware 需要同时开启 publish_release（固件组装依赖已发布的插件包 Release）"
            exit 1
          fi

      - name: 选择目标版本
        id: release
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_release.sh" \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_OUTPUT" \
            "${{ inputs.version }}"

      - name: 解析 SDK 下载地址
        id: sdk
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_sdk.sh" \
            "${{ steps.release.outputs.version }}" \
            "$GITHUB_OUTPUT"

      - name: 下载并解包 SDK
        run: |
          sdk_name="${{ steps.sdk.outputs.sdk_name }}"
          curl -fsSL --retry 3 "${{ steps.sdk.outputs.sdk_url }}" -o "$sdk_name"
          mkdir sdk
          # 官方 24.10/25.12 的 SDK 均为 zstd（.tar.zst）压缩；兼容旧的 xz
          case "$sdk_name" in
            *.tar.zst) tar --zstd -xf "$sdk_name" -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf "$sdk_name" -C sdk --strip-components=1 ;;
            *) echo "未知 SDK 压缩格式: $sdk_name"; exit 1 ;;
          esac
          ls -lh "$sdk_name"

      - name: 使用官方 feeds
        working-directory: sdk
        run: |
          curl -fsSL \
            "https://downloads.immortalwrt.org/releases/${{ steps.release.outputs.version }}/targets/rockchip/armv8/feeds.buildinfo" \
            -o feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 解析源码插件清单
        id: plugins
        working-directory: sdk
        run: |
          names=($(bash "$GITHUB_WORKSPACE/scripts/build_config.sh" source-plugins \
            . "$GITHUB_WORKSPACE/config/source-plugins.list"))
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::notice::config/source-plugins.list 没有启用的源码插件（默认全部注释），本次不编译不发布"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${names[@]}" | tee plugin-names.txt
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译插件
        if: steps.plugins.outputs.built == 'true'
        working-directory: sdk
        run: |
          names=($(cat plugin-names.txt))
          for name in "${names[@]}"; do
            echo "CONFIG_PACKAGE_${name}=y" >> .config
          done
          make defconfig
          for name in "${names[@]}"; do
            echo "=== 编译插件: $name ==="
            make package/"$name"/compile -j"$(nproc)" V=s 2>&1 | tee -a build.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              tail -100 build.log
              exit "$code"
            fi
          done

      - name: 收集插件包
        if: steps.plugins.outputs.built == 'true'
        run: |
          mkdir stage
          # 24.10 产出 .ipk（opkg），25.12 产出 .apk（apk），按版本自动匹配；
          # kmod 由官方源在组装固件时提供，SDK 编译的 kmod 不收集，避免版本混淆
          find sdk/bin/packages \( -name '*.ipk' -o -name '*.apk' \) ! -name 'kmod-*' -exec cp {} stage/ \;
          # 包名清单随包发布，阶段 2 组装固件时按它自动安装
          cp sdk/plugin-names.txt stage/packages.list
          count=$(find stage \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "没有收集到任何插件包"
            exit 1
          fi
          echo "共收集 $count 个插件包："
          ls -lh stage/
          tar -czf "h28k-packages-v${{ steps.release.outputs.version }}.tar.gz" -C stage .

      - name: 上传插件包构件
        if: steps.plugins.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: H28K 插件包-v${{ steps.release.outputs.version }}
          path: h28k-packages-v*.tar.gz
          retention-days: 30

      - name: 发布插件包 Release
        if: inputs.publish_release && steps.plugins.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_DATE=$(TZ=Asia/Hong_Kong date +'%Y%m%d')
          PKG_TAG="h28k-packages-v${{ steps.release.outputs.version }}-$PKG_DATE"
          gh release create "$PKG_TAG" "h28k-packages-v${{ steps.release.outputs.version }}.tar.gz" \
            --title "H28K 插件包 v${{ steps.release.outputs.version }} ($PKG_DATE)" \
            --notes "基于官方 SDK 编译的第三方插件（$(cat sdk/plugin-names.txt | tr '\n' ' ') 及依赖）。
          - 供「快速定制构建」工作流注入 ImageBuilder；kmod 由官方源在组装时提供
          - 基于上游 ${{ steps.release.outputs.tag }}"

      - name: 解析基础 Release（ImageBuilder）
        if: inputs.build_firmware
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_ib.sh" \
            "${{ inputs.version }}" "$GITHUB_OUTPUT"

      - name: 下载 ImageBuilder
        if: inputs.build_firmware
        run: |
          curl -fsSL --retry 3 "${{ steps.base.outputs.url }}" -o ib.tar.xz
          ls -lh ib.tar.xz

      - name: 组装完整固件
        if: inputs.build_firmware
        env:
          CFG_LAN_IP: ${{ inputs.lan_ip }}
          CFG_PASSWORD: ${{ inputs.password }}
          CFG_ROOTFS_SIZE: ${{ inputs.rootfs_size }}
        run: |
          mkdir out
          # 直接使用本次编译出的插件包（无需再从 Release 下载）；未启用插件时组装纯官方固件
          plugins_file="h28k-packages-v${{ steps.release.outputs.version }}.tar.gz"
          [ -f "$plugins_file" ] || plugins_file=""
          bash "$GITHUB_WORKSPACE/scripts/build_ib_image.sh" \
            ib.tar.xz \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_WORKSPACE/config/ib-packages.list" \
            "$GITHUB_WORKSPACE/out" \
            "$plugins_file"

      - name: 上传固件构件
        if: inputs.build_firmware
        uses: actions/upload-artifact@v4
        with:
          name: H28K 定制固件-基于v${{ steps.release.outputs.version }}
          path: out/*sysupgrade*.img.gz
          retention-days: 30

      - name: 发布固件 Release
        if: inputs.build_firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f sdk/plugin-names.txt ]; then
            names="启用插件：$(cat sdk/plugin-names.txt | tr '\n' ' ')"
          else
            names="未启用源码插件（纯官方组件）"
          fi
          FW_TAG="h28k-custom-v${{ steps.release.outputs.version }}-$(TZ=Asia/Hong_Kong date +'%Y%m%d%H%M%S')"
          gh release create "$FW_TAG" out/*sysupgrade*.img.gz \
            --title "H28K 定制固件（基于 v${{ steps.release.outputs.version }}）" \
            --notes "本插件包工作流一次完成：SDK 编译插件 + ImageBuilder 组装。
          - $names（ib-packages.list 全量清单见仓库）
          - 内核与上游 ${{ steps.release.outputs.tag }} 完全一致（ABI 不变）
          - 管理地址/root 密码见本次运行输入"
