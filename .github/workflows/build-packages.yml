name: H28K 插件包构建（24.10 出 ipk / 25.12 出 apk，单 Release 覆盖更新）

on:
  schedule:
    # UTC 周日 17:00 = 上海时间周一凌晨 01:00（与周更固件同为上海时间）
    - cron: '0 17 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-packages-hinlink-h28k
  cancel-in-progress: false

jobs:
  build:
    name: 编译 ${{ matrix.version }} 插件包
    strategy:
      fail-fast: false
      # 固定使用两个系列滚动快照的官方 SDK：24.10 出 ipk、25.12 出 apk。
      # 插件包名不含固件版本号，同系列全部版本的组装共用；快照 SDK 编译
      # 的用户态包对同系列各点版本兼容
      matrix:
        version:
          - 24.10-SNAPSHOT
          - 25.12-SNAPSHOT
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G

    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 安装 SDK 编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang cmake cpio file flex gawk gettext git libelf-dev \
            libncurses-dev libssl-dev python3 python3-ply python3-pyelftools \
            rsync subversion swig unzip upx-ucl wget xxd zlib1g-dev zstd

      - name: 选择目标版本
        id: release
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_release.sh" \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_OUTPUT" \
            "${{ matrix.version }}"

      - name: 解析 SDK 下载地址
        id: sdk
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_sdk.sh" \
            "${{ steps.release.outputs.version }}" \
            "$GITHUB_OUTPUT"

      - name: 恢复下载与编译缓存（dl + ccache，按版本键）
        uses: actions/cache@v4
        with:
          path: |
            sdk/dl
            sdk/.ccache
          key: h28k-pkgcache-${{ steps.release.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            h28k-pkgcache-${{ steps.release.outputs.version }}-
            h28k-pkgcache-

      - name: 下载并解包 SDK
        run: |
          sdk_name="${{ steps.sdk.outputs.sdk_name }}"
          curl -fsSL --retry 3 "${{ steps.sdk.outputs.sdk_url }}" -o "$sdk_name"
          # -p：缓存恢复会先创建 sdk/ 目录，不能因已存在而失败
          mkdir -p sdk
          case "$sdk_name" in
            *.tar.zst) tar --zstd -xf "$sdk_name" -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf "$sdk_name" -C sdk --strip-components=1 ;;
            *) echo "未知 SDK 压缩格式: $sdk_name"; exit 1 ;;
          esac
          ls -lh "$sdk_name"

      - name: 使用官方 feeds
        working-directory: sdk
        run: |
          # base_url 由 select_release.sh 输出：正式版与 X.Y-SNAPSHOT 为
          # releases/<版本>，master 为 snapshots——不能写死 releases/，否则
          # master 的 feeds.buildinfo 404
          curl -fsSL \
            "${{ steps.release.outputs.base_url }}/targets/rockchip/armv8/feeds.buildinfo" \
            -o feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 解析源码插件清单
        id: plugins
        working-directory: sdk
        run: |
          names=($(bash "$GITHUB_WORKSPACE/scripts/build_config.sh" source-plugins \
            . "$GITHUB_WORKSPACE/config/source-plugins.list"))
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::notice::config/source-plugins.list 没有启用的源码插件，本次不编译"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${names[@]}" | tee plugin-names.txt
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译插件（全速并行，逐包容错，只输出错误）
        if: steps.plugins.outputs.built == 'true'
        working-directory: sdk
        run: |
          names=($(cat plugin-names.txt))
          for name in "${names[@]}"; do
            echo "CONFIG_PACKAGE_${name}=y" >> .config
          done
          # ccache 跨运行编译缓存（配合 actions/cache 的 sdk/.ccache，
          # 容量由 job env 的 CCACHE_MAXSIZE 控制）
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          # 本步骤自行判断退出码：set +e 保住 PIPESTATUS（跟在 || true 后会被
          # true 重置为 0，失败会被误判成功、单核 V=s 详细重试永远不会触发）
          # 逐包容错：单包终败记入 failed-packages.txt 并继续编其余包，
          # 只有全部失败才中止（与组装阶段的缺包自动剔除同思路）
          set +e
          : > failed-packages.txt
          ok=0
          for name in "${names[@]}"; do
            echo "=== 编译插件: $name ==="
            make package/"$name"/compile -j"$(nproc)" 2>&1 | tee -a build.log | grep --line-buffered -iE 'error|failed'
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              echo "=== $name 编译失败（exit $code），转单核详细重试 ==="
              make package/"$name"/compile -j1 V=s 2>&1 | tee -a build-single.log
              code=${PIPESTATUS[0]}
              if [ "$code" -ne 0 ]; then
                echo "    ⚠ 编译失败，已跳过: $name"
                echo "$name" >> failed-packages.txt
                continue
              fi
              echo "=== $name 单核重试成功 ==="
            fi
            ok=$((ok+1))
          done
          total=$(wc -l < plugin-names.txt)
          echo "=== 编译完成：成功 $ok / $total ==="
          if [ "$ok" -eq 0 ]; then
            echo "❌ 全部插件编译失败"
            tail -n 200 build-single.log || true
            exit 1
          fi

      - name: 收集插件包并标准化重命名
        if: steps.plugins.outputs.built == 'true'
        working-directory: sdk
        run: |
          mkdir -p stage
          find bin/packages \( -name '*.ipk' -o -name '*.apk' \) ! -name 'kmod-*' -exec cp {} stage/ \;
          # packages.list 只保留编译成功的包：失败包若留在清单里，组装阶段
          # 会尝试安装不存在的包（触发逐包降级拖慢甚至预检剔除）
          if [ -s failed-packages.txt ]; then
            grep -vxFf failed-packages.txt plugin-names.txt > stage/packages.list
            cp failed-packages.txt stage/failed-packages.list
          else
            cp plugin-names.txt stage/packages.list
          fi
          # 系列级命名（不带固件版本号，也不绑定设备/发行版）：
          # 24.10-SNAPSHOT → 24.10（ipk），25.12-SNAPSHOT → 25.12（apk）
          V="${{ matrix.version }}"
          V="${V%-SNAPSHOT}"
          case "$V" in
            24.10) fmt=ipk ;;
            *) fmt=apk ;;
          esac
          # tar 先写到 stage 外再移入，避免"边打包边写自身"
          tar -czf "packages-${V}-${fmt}.tar.gz" -C stage .
          mv "packages-${V}-${fmt}.tar.gz" stage/
          ls -lh stage/

      - name: 上传构建产物（供发布 job 汇总到单 Release）
        if: steps.plugins.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.version }}
          path: sdk/stage/
          retention-days: 3

      - name: 上传编译日志与失败清单
        if: steps.plugins.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-plugins-logs-${{ matrix.version }}-${{ github.run_number }}
          path: |
            sdk/build.log
            sdk/build-single.log
            sdk/failed-packages.txt
          if-no-files-found: ignore
          retention-days: 15

  publish:
    name: 发布插件包 Release（单 Release 覆盖更新）
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: openwrt-plugins
    steps:
      - name: 检出支持仓库（删除旧 tag 需要 git 仓库）
        uses: actions/checkout@v4

      - name: 汇总两个系列的构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理附件与发布说明
        run: |
          mkdir -p release_files
          find artifacts -type f \( -name '*.apk' -o -name '*.ipk' -o -name 'packages-*.tar.gz' \) \
            -exec cp -f {} release_files/ \;
          count=$(find release_files -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "没有任何插件产物可发布"; exit 1; }

          PLIST="$(find artifacts -name packages.list -type f | head -n1)"
          PLUGINS='（无）'
          [ -n "$PLIST" ] && PLUGINS="$(tr '\n' ' ' < "$PLIST")"

          # 各系列编译失败的包如实标注（packages.list 已剔除，不会进入组装安装清单）
          FAILED_ALL=''
          for fl in $(find artifacts -name failed-packages.list -type f); do
            [ -s "$fl" ] || continue
            series_dir="$(basename "$(dirname "$fl")")"
            series="${series_dir#pkg-}"
            FAILED_ALL="$FAILED_ALL
          - **⚠ ${series} 系编译失败，本次未包含**："
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              FAILED_ALL="$FAILED_ALL
            - $p"
            done < "$fl"
          done

          TITLE="OpenWrt 插件包（ipk + apk，aarch64_generic）"
          NOTES="## OpenWrt 插件包（ipk + apk，aarch64_generic，单 Release 覆盖更新）

          - **组件类型**：源码插件独立编译包（供 OpenWrt/ImmortalWrt 直接安装或组装配方使用）
          - **适用范围**：任意 **aarch64_generic**（AArch64 通用）架构的 OpenWrt/ImmortalWrt
            设备，不限型号——24.10 系（opkg）安装 ipk，25.12 系（apk）安装 apk；
            用户态包对同系列各点版本兼容
          - **编译基准**：24.10-SNAPSHOT / 25.12-SNAPSHOT 系列快照 SDK
          - **已包含插件**：$PLUGINS
          - **附件**：\`packages-24.10-ipk.tar.gz\`、\`packages-25.12-apk.tar.gz\`（整包）
            及各插件单独附件
          ${FAILED_ALL}
          - **更新方式**：每周一凌晨 1:00（上海时间）自动构建并覆盖更新本 Release"

          # 非破坏性覆盖：同名附件 clobber 更新，单系列失败时另一系列的旧附件保留
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_files/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" release_files/* --title "$TITLE" \
              --notes "$NOTES" --latest=false
          fi
          echo "=== 已发布 $TAG ==="
          gh release view "$TAG" --json assets --jq '.assets[].name'
