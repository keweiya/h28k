name: H28K 插件包构建（SDK 编译源码插件 → 长期 Release）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本：24.10 / 25.12（系列矩阵）/ X.Y.Z / X.Y-SNAPSHOT / master / all'
        type: string
        required: true
        default: master
      publish_release:
        description: '发布插件包为 Release'
        type: boolean
        required: true
        default: true
      build_firmware:
        description: '编译完插件后立即组装定制固件'
        type: boolean
        required: false
        default: false
      lan_ip:
        description: '组装固件时的 LAN 管理地址'
        type: string
        required: false
        default: '192.168.100.1'
      password:
        description: '组装固件时的 root 密码'
        type: string
        required: false
        default: 'password'
      rootfs_size:
        description: '组装固件时的根目录大小'
        type: choice
        required: false
        default: 2G
        options:
          - 2G
          - 1G
          - 512M

permissions:
  contents: write

concurrency:
  group: build-packages-hinlink-h28k-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  matrix:
    name: 解析目标版本矩阵
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 解析版本列表
        id: resolve
        run: |
          bash "$GITHUB_WORKSPACE/scripts/resolve_versions.sh" \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "${{ inputs.version }}" \
            "$GITHUB_OUTPUT"

  packages:
    name: 编译 ${{ matrix.version }} 插件包
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 安装 SDK 编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang cmake cpio file flex gawk gettext git libelf-dev \
            libncurses-dev libssl-dev python3 python3-ply python3-pyelftools \
            rsync subversion swig unzip upx-ucl wget xxd zlib1g-dev zstd

      - name: 检查参数组合
        run: |
          if [[ "${{ inputs.build_firmware }}" == "true" && "${{ inputs.publish_release }}" != "true" ]]; then
            echo "build_firmware 需要同时开启 publish_release"
            exit 1
          fi

      - name: 选择目标版本
        id: release
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_release.sh" \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_OUTPUT" \
            "${{ matrix.version }}"

      - name: 解析 SDK 下载地址
        id: sdk
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_sdk.sh" \
            "${{ steps.release.outputs.version }}" \
            "$GITHUB_OUTPUT"

      - name: 下载并解包 SDK
        run: |
          sdk_name="${{ steps.sdk.outputs.sdk_name }}"
          curl -fsSL --retry 3 "${{ steps.sdk.outputs.sdk_url }}" -o "$sdk_name"
          mkdir sdk
          case "$sdk_name" in
            *.tar.zst) tar --zstd -xf "$sdk_name" -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf "$sdk_name" -C sdk --strip-components=1 ;;
            *) echo "未知 SDK 压缩格式: $sdk_name"; exit 1 ;;
          esac
          ls -lh "$sdk_name"

      - name: 使用官方 feeds
        working-directory: sdk
        run: |
          curl -fsSL \
            "https://downloads.immortalwrt.org/releases/${{ steps.release.outputs.version }}/targets/rockchip/armv8/feeds.buildinfo" \
            -o feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 解析源码插件清单
        id: plugins
        working-directory: sdk
        run: |
          names=($(bash "$GITHUB_WORKSPACE/scripts/build_config.sh" source-plugins \
            . "$GITHUB_WORKSPACE/config/source-plugins.list"))
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::notice::config/source-plugins.list 没有启用的源码插件，本次不编译"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${names[@]}" | tee plugin-names.txt
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译插件（全速并行，只输出错误）
        if: steps.plugins.outputs.built == 'true'
        working-directory: sdk
        run: |
          names=($(cat plugin-names.txt))
          for name in "${names[@]}"; do
            echo "CONFIG_PACKAGE_${name}=y" >> .config
          done
          make defconfig
          # 本步骤自行判断退出码：set +e 保住 PIPESTATUS（跟在 || true 后会被
          # true 重置为 0，失败会被误判成功、单核 V=s 详细重试永远不会触发）
          set +e
          for name in "${names[@]}"; do
            echo "=== 编译插件: $name ==="
            make package/"$name"/compile -j"$(nproc)" 2>&1 | tee -a build.log | grep --line-buffered -iE 'error|failed'
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              echo "=== $name 编译失败（exit $code），转单核详细重试 ==="
              make package/"$name"/compile -j1 V=s 2>&1 | tee -a build-single.log
              code=${PIPESTATUS[0]}
              if [ "$code" -ne 0 ]; then
                echo "=== $name 单核重试仍失败 ==="
                tail -n 200 build-single.log || true
                exit "$code"
              fi
              echo "=== $name 单核重试成功 ==="
            fi
          done

      - name: 收集插件包并标准化重命名
        if: steps.plugins.outputs.built == 'true'
        run: |
          mkdir -p stage
          find sdk/bin/packages \( -name '*.ipk' -o -name '*.apk' \) ! -name 'kmod-*' -exec cp {} stage/ \;
          cp sdk/plugin-names.txt stage/packages.list
          count=$(find stage \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "没有收集到任何插件包"
            exit 1
          fi
          # 正式版沿用 vX.Y.Z 命名，滚动快照（master / X.Y-SNAPSHOT）用原样字符串
          V="${{ matrix.version }}"
          case "$V" in master|*-SNAPSHOT) ;; *) V="v$V" ;; esac
          PKG_NAME="immortalwrt-${V}-h28k-packages.tar.gz"
          tar -czf "$PKG_NAME" -C stage .
          echo "PKG_FILE=$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_TAG=immortalwrt-h28k-packages-$V" >> "$GITHUB_ENV"
          echo "PKG_VERSION_SUFFIX=$V" >> "$GITHUB_ENV"
          ls -lh "$PKG_NAME"

      - name: 上传插件包构件
        if: steps.plugins.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ matrix.version }}-h28k-packages-${{ github.run_number }}
          path: ${{ env.PKG_FILE }}
          retention-days: 30

      - name: 发布插件包 Release（独立 Packages Release）
        if: inputs.publish_release && steps.plugins.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.PKG_TAG }}"
          TITLE="ImmortalWrt H28K 插件包 ${{ env.PKG_VERSION_SUFFIX }}"
          NOTES="## ImmortalWrt H28K 插件包 ${{ env.PKG_VERSION_SUFFIX }}

          - **组件类型**：源码插件独立编译包（供组装定制固件注入）
          - **基于底包**：ImmortalWrt ${{ steps.release.outputs.revision }}
          - **已包含插件**：$(cat sdk/plugin-names.txt | tr '\n' ' ')
          - **附件内容**：\`${{ env.PKG_FILE }}\`（解压包含全部预编译 .ipk / .apk 及依赖）"

          # 直接替换：删除旧 Release 与 tag 后整体重建
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true
          gh release create "$TAG" "${{ env.PKG_FILE }}" --title "$TITLE" --notes "$NOTES"

      - name: 解析基础 Release（ImageBuilder）
        if: inputs.build_firmware
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_ib.sh" \
            "${{ matrix.version }}" "$GITHUB_OUTPUT"

      - name: 下载 ImageBuilder
        if: inputs.build_firmware
        run: |
          curl -fsSL --retry 3 "${{ steps.base.outputs.url }}" -o ib.tar.zst

      - name: 组装定制固件
        if: inputs.build_firmware
        env:
          CFG_LAN_IP: ${{ inputs.lan_ip }}
          CFG_PASSWORD: ${{ inputs.password }}
          CFG_ROOTFS_SIZE: ${{ inputs.rootfs_size }}
        run: |
          mkdir -p out
          plugins_arg=""
          [ -f "${{ env.PKG_FILE }}" ] && plugins_arg="${{ env.PKG_FILE }}"
          bash "$GITHUB_WORKSPACE/scripts/build_ib_image.sh" \
            ib.tar.zst \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_WORKSPACE/config/ib-packages.list" \
            "$GITHUB_WORKSPACE/out" \
            "$plugins_arg" \
            "${{ matrix.version }}"

      - name: 整理并重命名定制固件产物
        if: inputs.build_firmware
        run: |
          mkdir -p custom_release_files
          V="${{ steps.base.outputs.rel_suffix }}"
          rm -f out/*targz-sysupgrade.img.gz 2>/dev/null || true

          for f in out/*ext4-sysupgrade.img.gz; do
            [ -f "$f" ] && cp -f "$f" "custom_release_files/immortalwrt-${V}-h28k-custom-ext4-sysupgrade.img.gz"
          done
          for f in out/*squashfs-sysupgrade.img.gz; do
            [ -f "$f" ] && cp -f "$f" "custom_release_files/immortalwrt-${V}-h28k-custom-squashfs-sysupgrade.img.gz"
          done
          for f in out/*rootfs.tar.gz; do
            [ -f "$f" ] && cp -f "$f" "custom_release_files/immortalwrt-${V}-h28k-custom-rootfs.tar.gz"
          done

      - name: 发布定制固件 Release（同步至 Custom Release）
        if: inputs.build_firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.base.outputs.rel_suffix }}"
          TAG="immortalwrt-h28k-custom-$V"
          BUILD_TIME="$(TZ=Asia/Hong_Kong date +'%Y-%m-%d %H:%M')"
          TITLE="ImmortalWrt H28K 定制固件 $V"
          NOTES="## ImmortalWrt H28K 定制固件 $V

          - **构建类型**：插件编译后自动组装定制包
          - **组装时间**：$BUILD_TIME
          - **基于底包**：ImmortalWrt ${{ matrix.version }}
          - **管理地址**：\`${{ inputs.lan_ip }}\`
          - **默认密码**：\`${{ inputs.password }}\`
          - **包含附件**：
            - \`immortalwrt-${V}-h28k-custom-ext4-sysupgrade.img.gz\`
            - \`immortalwrt-${V}-h28k-custom-squashfs-sysupgrade.img.gz\`
            - \`immortalwrt-${V}-h28k-custom-rootfs.tar.gz\`"

          shopt -s nullglob
          FILES=(custom_release_files/*)
          if [ ${#FILES[@]} -gt 0 ]; then
            # 直接替换：删除旧 Release 与 tag 后整体重建
            gh release delete "$TAG" --yes 2>/dev/null || true
            git push origin :refs/tags/"$TAG" 2>/dev/null || true
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES"
          fi
