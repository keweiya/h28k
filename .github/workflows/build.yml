name: H28K 固件全量构建（源码编译 → 固件 + 自建 ImageBuilder）

# 从源码完整编译：官方源码 + H28K 补丁 + check-abi 门禁。
# 产物发布到 Release（tag = h28k-v<版本>；重复构建会覆盖更新同一 Release）：
#   基础固件（不含第三方插件）+ rootfs.tar.gz + 自建 ImageBuilder。
# 日常出固件请用「H28K 固件快速组装」工作流（用本工作流产出的 ImageBuilder）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的 ImmortalWrt 版本'
        type: choice
        required: true
        default: 25.12.1
        options:
          - 25.12.1
          - 25.12.0
          - 24.10.6
          - 24.10.5
      lan_ip:
        description: 'LAN 管理地址'
        type: string
        required: false
        default: '192.168.100.1'
      password:
        description: 'root 密码'
        type: string
        required: false
        default: 'password'
      rootfs_size:
        description: '固件根目录大小'
        type: choice
        required: true
        default: '2048'
        options:
          - '512'
          - '1024'
          - '2048'

permissions:
  contents: write

concurrency:
  group: build-h28k-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 ${{ inputs.version }} 固件
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          echo "=== Before cleanup ==="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /usr/local/share/chromium 2>/dev/null || true
          sudo rm -rf /usr/share/swift 2>/dev/null || true
          sudo rm -rf /usr/local/.rustup 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            genisoimage gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm lrzsz msmtp ninja-build openssl p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip wget xmlto xxd zlib1g-dev zstd

      - name: 选择 ImmortalWrt 版本
        id: release
        run: |
          bash "$GITHUB_WORKSPACE/scripts/select_release.sh" \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_OUTPUT" \
            "${{ inputs.version }}"

      - name: 克隆正式版源码
        run: |
          git clone --branch "${{ steps.release.outputs.tag }}" --single-branch --depth=1 \
            https://github.com/immortalwrt/immortalwrt.git source

      - name: 恢复下载缓存
        uses: actions/cache@v4
        with:
          path: source/dl
          key: h28k-dl-${{ steps.release.outputs.series }}-${{ steps.release.outputs.version }}
          restore-keys: |
            h28k-dl-${{ steps.release.outputs.series }}-

      - name: 应用 HINLINK H28K 补丁
        working-directory: source
        run: |
          bash "$GITHUB_WORKSPACE/scripts/apply_patches.sh" \
            . "$GITHUB_WORKSPACE/patches/${{ steps.release.outputs.series }}"

      - name: 使用官方 feeds
        working-directory: source
        run: |
          curl -fsSL \
            "https://downloads.immortalwrt.org/releases/${{ steps.release.outputs.version }}/targets/rockchip/armv8/feeds.buildinfo" \
            -o feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用构建配置
        working-directory: source
        env:
          CFG_LAN_IP: ${{ inputs.lan_ip }}
          CFG_PASSWORD: ${{ inputs.password }}
          # 基础固件不含第三方主题（nikki/fluent 由 SDK 工作流单独编译、阶段 2 注入）
          CFG_DEFAULT_THEME: ''
        run: |
          bash "$GITHUB_WORKSPACE/scripts/build_config.sh" prepare \
            . \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "$GITHUB_ENV"

      - name: 准备内核配置
        working-directory: source
        env:
          CFG_ROOTFS_SIZE: ${{ inputs.rootfs_size }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/prepare_kernel_config.sh" \
            . \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.series }}" \
            "$GITHUB_WORKSPACE/config/hinlink-h28k.config"

      - name: 下载源码包
        working-directory: source
        timeout-minutes: 90
        run: |
          make -j"$(nproc)" download V=s
          find dl -size -1024c -print -delete
          du -sh dl

      - name: 编译固件
        working-directory: source
        timeout-minutes: 300
        run: |
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "=== Build failed, disk space ==="
            df -h /
            tail -100 build.log
            exit "$code"
          fi

      - name: 生成 ImageBuilder 工具包
        working-directory: source
        run: |
          make imagebuilder -j"$(nproc)"
          ls -lh bin/targets/rockchip/armv8/immortalwrt-imagebuilder-*

      - name: 校验内核 ABI
        working-directory: source
        run: |
          bash "$GITHUB_WORKSPACE/scripts/build_config.sh" check-abi \
            . \
            "$GITHUB_WORKSPACE/config/firmware.conf" \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.kernel_kmods }}"

      - name: 检查固件产物
        working-directory: source
        run: |
          shopt -s nullglob
          FIRMWARE_FILES=(bin/targets/rockchip/armv8/*hinlink_h28k*sysupgrade.img.gz)
          if [ "${#FIRMWARE_FILES[@]}" -eq 0 ]; then
            echo "HINLINK H28K sysupgrade firmware not found"
            ls -lh bin/targets/rockchip/armv8/ 2>/dev/null || true
            exit 1
          fi
          ls -lh "${FIRMWARE_FILES[@]}"
          IB_FILE="$(find bin/targets/rockchip/armv8 -maxdepth 1 \
            -name 'immortalwrt-imagebuilder-*' -print -quit)"
          if [ -z "$IB_FILE" ]; then
            echo "ImageBuilder tarball not found"
            exit 1
          fi
          echo "IB_FILE=source/$IB_FILE" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(TZ=Asia/Hong_Kong date +'%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          echo "UPSTREAM_HASH=$(git log -1 --format='%h')" >> "$GITHUB_ENV"

      - name: 上传固件构件
        uses: actions/upload-artifact@v4
        with:
          name: H28K 基础固件-${{ steps.release.outputs.tag }}
          path: |
            source/bin/targets/rockchip/armv8/*hinlink_h28k*sysupgrade.img.gz
            source/bin/targets/rockchip/armv8/*rootfs.tar.gz
            ${{ env.IB_FILE }}
          retention-days: 30

      - name: 发布 Release（覆盖更新）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="h28k-v${{ steps.release.outputs.version }}"
          shopt -s nullglob
          FILES=(source/bin/targets/rockchip/armv8/*hinlink_h28k*sysupgrade.img.gz \
                 source/bin/targets/rockchip/armv8/*rootfs.tar.gz \
                 "${{ env.IB_FILE }}")
          TITLE="H28K 固件 ${{ steps.release.outputs.tag }}"
          NOTES="## H28K 固件 ${{ steps.release.outputs.tag }}（基础固件）

          - **构建时间**：${{ env.BUILD_TIME }}
          - **上游版本**：${{ steps.release.outputs.tag }} (${{ env.UPSTREAM_HASH }})
          - **设备型号**：HINLINK H28K (RK3528)
          - **管理地址**：\`${{ env.FIRMWARE_LAN_IP }}\`
          - **root 密码**：\`${{ env.FIRMWARE_PASSWORD }}\`
          - **附件内容**：基础固件（squashfs/ext4，不含第三方插件）+ rootfs.tar.gz（LXC 用）+ 自建 ImageBuilder

          重复构建本版本会覆盖更新本 Release。日常使用的固件请用「H28K 固件快速组装」工作流产出。"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES"
          fi
          # 25.12 为主力系列，其 Release 标记为仓库 latest
          if [[ "${{ steps.release.outputs.series }}" == "25.12" ]]; then
            gh release edit "$TAG" --latest
          else
            gh release edit "$TAG" --latest=false
          fi

      - name: 上传失败编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 编译失败日志-${{ inputs.version }}
          path: source/build.log
          if-no-files-found: ignore
          retention-days: 7
