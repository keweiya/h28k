name: H28K 矩阵产物转发布（Artifacts → Base Release）

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '矩阵编译的 Run ID（actions/runs/ 后面那串数字，Artifacts 需未过期：保留 15 天）'
        type: string
        required: true
      versions:
        description: '仅发布这些版本（空格分隔，如 "24.10.5 master"）；留空 = 发布该 run 的全部矩阵产物'
        type: string
        required: false
        default: ''
      mark_latest:
        description: '将该版本标记为 latest（留空 = 自动：本次发布中最新的正式版）'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-h28k-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 解析待发布版本
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 列出矩阵 Artifacts 并生成发布矩阵
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          FILTER: ${{ inputs.versions }}
          MARK_LATEST: ${{ inputs.mark_latest }}
        run: |
          fail() { echo "error: $*" >&2; exit 1; }
          # 自包含：不依赖 checkout 分支的 scripts/config.sh（master 指针检出的是旧版）
          is_known_version() {
            [[ "$1" == master || "$1" =~ ^[0-9]+[.][0-9]+-SNAPSHOT$ || "$1" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          }

          names="$(gh api "repos/{owner}/{repo}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --paginate --jq ".artifacts[].name")" ||
            fail "读取 Run $RUN_ID 的 Artifacts 失败（检查 Run ID 是否正确）"

          declare -A seen=()
          entries=""
          all_versions_list=()
          while IFS= read -r name; do
            [[ "$name" == h28k-matrix-* ]] || continue
            v="$(sed -nE 's/^h28k-matrix-(.+)-[0-9]+$/\1/p' <<< "$name")"
            [[ -n "$v" ]] || continue
            [[ -n "${seen[$v]:-}" ]] && continue
            if [[ -n "$FILTER" ]]; then
              ok=0
              for f in $FILTER; do [[ "$f" == "$v" ]] && ok=1; done
              [[ "$ok" == 1 ]] || continue
            fi
            if ! is_known_version "$v"; then
              fail "无法识别矩阵产物版本：$v"
            fi
            if [[ "$v" == "24.10.0" ]]; then
              echo "跳过 24.10.0（上游 24.10.1 才引入 phy-leds，无法应用板级补丁）" >&2
              continue
            fi
            seen[$v]=1
            all_versions_list+=("$v")
            entries+="{\"version\":\"$v\",\"artifact\":\"$name\"},"
          done <<< "$names"

          [[ -n "$entries" ]] ||
            fail "Run $RUN_ID 中没有匹配的矩阵产物（确认 Run ID 与 versions 过滤条件）"

          # latest：本次发布中最新的正式版；mark_latest 显式指定时优先
          latest="$MARK_LATEST"
          if [[ -z "$latest" ]]; then
            for v in $(printf '%s\n' "${all_versions_list[@]}" |
                       grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uVr); do
              latest="$v"
              break
            done
          fi
          if [[ -n "$latest" ]]; then
            printf '%s\n' "${all_versions_list[@]}" | grep -qxF "$latest" ||
              fail "mark_latest 指定的版本 $latest 不在本次发布列表中"
          fi

          printf 'matrix=[%s]\n' "${entries%,}" >> "$GITHUB_OUTPUT"
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          echo "待发布：${#seen[@]} 个版本；latest=$latest"

  publish:
    name: 发布 ${{ matrix.version }} 为 Base Release
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ matrix.version }}
      LATEST_VERSION: ${{ needs.prepare.outputs.latest }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 下载矩阵产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pkg

      - name: 还原为 Base 命名并校验内容
        id: pack
        run: |
          fail() { echo "error: $*" >&2; exit 1; }
          # 自包含 rel_suffix：正式版 vX.Y.Z，滚动快照用原样字符串（与全量构建一致）
          case "$VERSION" in
            master|*-SNAPSHOT) rel="$VERSION" ;;
            *) rel="v$VERSION" ;;
          esac
          printf 'rel_suffix=%s\n' "$rel" >> "$GITHUB_OUTPUT"

          mkdir -p release_files
          shopt -s nullglob
          found=0
          for f in pkg/immortalwrt-*-h28k-matrix-*; do
            [ -f "$f" ] || continue
            found=1
            b="$(basename "$f")"
            mv "$f" "release_files/${b/-h28k-matrix-/-h28k-base-}"
          done
          [[ "$found" == 1 ]] || fail "产物中没有预期的 immortalwrt-*-h28k-matrix-* 文件"

          echo "=== 待发布文件（已还原 base 命名）==="
          ls -lh release_files/

          # ImageBuilder 是否存在：缺失时阶段 2 组装不可用（矩阵触发未勾选 include_ib）
          ib_ok=0
          for f in release_files/immortalwrt-*-h28k-base-imagebuilder-*.tar.zst; do
            [ -f "$f" ] && ib_ok=1
          done
          if [[ "$ib_ok" != 1 ]]; then
            echo "::warning::该版本产物中没有 ImageBuilder（矩阵触发时未勾选 include_ib），阶段 2 快速组装将无法使用"
          fi

      - name: 发布 Release（唯一 Base Release，原地重建）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL: ${{ steps.pack.outputs.rel_suffix }}
        run: |
          TAG="immortalwrt-h28k-base-$REL"
          TITLE="ImmortalWrt H28K 基础固件 $REL（矩阵编译）"
          NOTES="## ImmortalWrt H28K 基础固件 $REL（矩阵编译产物）

          - **构建类型**：矩阵编译（Artifacts 转发布）
          - **上游版本**：$VERSION
          - **来源**：https://github.com/${{ github.repository }}/actions/runs/$SOURCE_RUN
          - **包含附件**：见下方资产列表（命名与全量构建产物一致，可直接用于阶段 2 组装）"

          shopt -s nullglob
          FILES=(release_files/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "未找到发布文件" >&2
            exit 1
          fi

          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true
          if [[ "$VERSION" == "$LATEST_VERSION" ]]; then
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES" --latest=false
          fi
          echo "=== 已发布 $TAG ==="
