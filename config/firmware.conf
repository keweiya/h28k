# 以下参数为固件的初始化默认值；Actions 手动触发时可在输入框临时覆盖（留空 = 用这里的值）

# 允许构建的系列：X.Y.Z 正式版与 X.Y-SNAPSHOT 分支快照按系列放行，master 滚动快照始终允许。
# 系列外的版本会直接拒绝；系列内的任意版本是否可构建由补丁应用与编译后 ABI 强校验兜底。
supported_series=24.10 25.12

# 系列内明确不支持、all 在线枚举时排除的版本：
# 24.10.0 上游没有 phy-leds 脚本（0030 板级补丁的前提），无法构建
excluded_versions=24.10.0

# 静态兜底列表：仅当 all 的在线枚举失败时使用（正常情况不会用到）。
# 手动填入系列内的其他版本（如 24.10.2）构建不需要加进这里。
supported_versions=master 24.10.5 24.10.6 25.12.0 25.12.1

# 固件 LAN 管理地址，必须填写有效的 IPv4 地址
lan_ip=192.168.100.1

# root 管理密码，直接填写明文，必须填写
password=password

# 固件根目录大小，单位 MiB（可选 512 / 1024 / 2048）
rootfs_size=2048

# LuCI 默认主题：留空表示不修改（使用内置 bootstrap 主题，默认如此）
# 启用了 fluent 等第三方主题后，可填写主题目录名（如 fluent），阶段 2 固件会默认使用它
default_theme=

# ---------- 以下为首启开机默认配置（组装阶段 2 注入；留空 = 跳过对应设置）----------
# 仅作用于定制固件（阶段 2 / 周更定制），不写入基础固件；设备上可随时修改

# WAN 联网方式（二选一，都留空 = 标准 DHCP 路由模式；组装/周更/插件包
# 工作流的输入框可临时覆盖，输入框留空 = 用这里的值）：
#   1. PPPoE 拨号：填写宽带账号与密码，WAN 自动改为拨号上网
#   2. 旁路由模式：填写主路由地址，自动设 LAN 网关/DNS 并关闭 LAN DHCP
# 两者同时填写会拒绝构建
pppoe_user=
pppoe_password=
bypass_gateway=

# 设备主机名（LAN 里显示的名字）
hostname=Orz

# Wi-Fi（USB 网卡 mt7921u）开机默认开启：ssid 留空则保持默认关闭。
# 密码即 WPA2 预共享密钥，至少 8 位；插着网卡的机器开机即广播此热点
wifi_ssid=Orz
wifi_password=qweaz1234567890

# LuCI 界面语言：zh_cn = 默认中文（需要固件里带对应中文语言包，阶段 2 默认已带）
luci_lang=zh_cn

# 时区（对应 Asia/Shanghai）与 NTP 服务器（空格分隔多个）
timezone=CST-8
ntp_servers=ntp.aliyun.com ntp1.aliyun.com time1.cloud.tencent.com

# true 表示使用官方内核配置、kmod 软件源并校验 ABI，false 表示全部跳过。
# 三种形态都校验 ABI；编译统一带 IGNORE_ERRORS="n m"（官方 buildbot 同款，
# 忽略未选中包/模块包的编译失败）；快照不构建全量 kmod（仅固件所需）
check_official_abi=true
