# 以下参数均在编译阶段直接写入固件源码

# 默认 ImmortalWrt 系列，只能是 24.10 或 25.12。
# 本仓库按系列构建：Actions 手动触发时选择 all 会同时编译两个系列，
# 此值仅作为本地调用 scripts/select_release.sh 未传系列参数时的回退值。
default_series=25.12

# 固件 LAN 管理地址，必须填写有效的 IPv4 地址
lan_ip=192.168.0.2

# root 管理密码，直接填写明文，必须填写
password=q

# LuCI 默认主题填写 luci-static 下的目录名，例如 fluent
# 不要填写软件包名 luci-theme-fluent，留空表示不修改
default_theme=fluent

# true 表示使用官方内核配置、kmod 软件源并校验 ABI，false 表示全部跳过
check_official_abi=true
