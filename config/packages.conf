# 每行填写一条完整的 git clone 命令，空行和以 # 开头的注释会被忽略
# 可以使用 -b 指定分支，最后一个参数填写克隆后的源码目录
# 目标路径相对于 OpenWrt 源码根目录，不能以 / 开头
# 软件包直接克隆到源码树，不会修改 feeds.conf.default 或添加运行时软件源
git clone --depth=1 -b main https://github.com/nikkinikki-org/OpenWrt-nikki.git package/OpenWrt-nikki
git clone --depth=1 https://github.com/LazuliKao/luci-theme-fluent.git package/luci-theme-fluent
git clone --depth=1 https://github.com/aijwfsibari/luci-theme-design package/luci-theme-design
